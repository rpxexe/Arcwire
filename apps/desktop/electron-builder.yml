appId: com.arcwire.messenger
productName: Arcwire
copyright: Copyright © 2026 Arcwire Team
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - resources/**/*
  - package.json
asar: true
# better-sqlite3 already has the Electron (ABI 132) prebuilt from scripts/setup-sqlite.ps1
npmRebuild: false
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/@node-rs/**/*
  - node_modules/argon2/**/*
  - out/main/chunks/*.node
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Arcwire
  uninstallDisplayName: Arcwire LAN Messenger
  runAfterFinish: true

